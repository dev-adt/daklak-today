# ─────────────────────────────────────────────────────────────
# Nginx Configuration cho DEV Test: dev.daklak.today
# Domain: dev.daklak.today | Backend Port: 3030
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name dev.daklak.today;

    # Gzip nén dữ liệu
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 50M;

    # ── /api/* → Node.js Dev Backend Proxy (Port 3030) ───────
    location /api/ {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 180s;
        proxy_connect_timeout 15s;
    }

    # ── Uploaded Media / Avatars ──
    location ^~ /uploads/ {
        proxy_pass         http://127.0.0.1:3030;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        expires            30d;
        add_header         Cache-Control "public, max-age=2592000";
    }

    # ── Vite Hashed Assets ──
    location /assets/ {
        root    /www/wwwroot/dev.daklak.today/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Media files ──
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2)$ {
        root    /www/wwwroot/dev.daklak.today/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Static files & SPA fallback: CHỐNG DÍNH CACHE index.html ──
    location / {
        root  /www/wwwroot/dev.daklak.today/public;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
