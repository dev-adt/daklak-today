# ─────────────────────────────────────────────────────────────
# Nginx Configuration cho DakLak.today (aaPanel / VPS Reverse Proxy)
# Domain: daklak.today & www.daklak.today | Backend Port: 3028
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name daklak.today www.daklak.today;

    # Tự động chuyển hướng sang HTTPS nếu đã có chứng chỉ SSL
    # return 301 https://$host$request_uri;

    # Gzip nén dữ liệu
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Giới hạn kích thước tải lên (cho phép upload ảnh bài viết / chứng từ)
    client_max_body_size 50M;

    # ── /api/* → Node.js Express Proxy (Port 3028) ────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3028;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout cho AI (hỗ trợ streaming và RAG response dài)
        proxy_read_timeout 180s;
        proxy_connect_timeout 15s;
    }

    # ── Uploaded Media / Avatars (Dùng ^~ để ngăn chặn regex ảnh can thiệp) ──
    location ^~ /uploads/ {
        proxy_pass         http://127.0.0.1:3028;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        expires            30d;
        add_header         Cache-Control "public, max-age=2592000";
    }

    # ── Vite Hashed Assets: Cache dài hạn ──────────────────────
    location /assets/ {
        root    /www/wwwroot/daklak.today/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Media files: Cache 7 ngày ─────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2)$ {
        root    /www/wwwroot/daklak.today/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Static files & SPA fallback: CHỐNG DÍNH CACHE index.html ──
    location / {
        root  /www/wwwroot/daklak.today/public;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
