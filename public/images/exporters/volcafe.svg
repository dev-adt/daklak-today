  <g transform="translate(25, 40)">
    <!-- Stylized coffee bean globe -->
    <circle cx="0" cy="0" r="17" fill="#F97316"/>
    <path d="M-8,-2 C-8,-10 0,-12 8,-7 C4,-2 2,4 -3,8 C-7,6 -8,2 -8,-2 Z" fill="#FFFFFF"/>
