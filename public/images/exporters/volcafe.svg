  </g>
  <!-- Typography -->
  <text x="52" y="36" font-family="'Inter', sans-serif" font-size="16" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">VOLCAFE</text>
  <text x="52" y="52" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#FB923C">ED&amp;F MAN COFFEE</text>
