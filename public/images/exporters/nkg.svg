<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <rect width="200" height="80" rx="12" fill="#540B16"/>
  <!-- Neumann Kaffee Gruppe (NKG) Emblem -->
  <g transform="translate(26, 40)">
    <circle cx="0" cy="0" r="18" fill="#7D1223"/>
    <!-- Stylized coffee bean & globe grid -->
    <path d="M-8,-2 C-8,-10 0,-12 8,-7 C4,-2 2,4 -3,8 C-7,6 -8,2 -8,-2 Z" fill="#E2A85C"/>
    <path d="M8,2 C8,10 0,12 -8,7 C-4,2 -2,-4 3,-8 C7,-6 8,-2 8,2 Z" fill="#FFFFFF" opacity="0.85"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#540B16" stroke-width="1.6"/>
  </g>
  <!-- Typography -->
  <text x="54" y="33" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="1.2" fill="#FFFFFF">NEUMANN</text>
  <text x="54" y="50" font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#E2A85C">KAFFEE GRUPPE</text>
  <text x="54" y="64" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" letter-spacing="0.8" fill="#FCE7C8">NKG • HAMBURG • EST. 1934</text>
</svg>
